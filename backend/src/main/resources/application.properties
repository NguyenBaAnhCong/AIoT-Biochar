spring.application.name=aiot-biochar
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
server.error.include-message=never

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/${POSTGRES_DB:edge_aiot_biochar}}
spring.datasource.username=${DB_USER:${POSTGRES_USER:biochar}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:biochar_dev_pw}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.idle-timeout=30000

spring.web.resources.cache.period=0
spring.sql.init.mode=never

app.migrations.enabled=${APP_MIGRATIONS_ENABLED:false}
app.migrations.location=${MIGRATIONS_DIR:database/migrations}
app.dev-seed.enabled=${SEED_DEV_PASSWORDS:false}
app.dev-seed.default-password=${DEV_DEFAULT_PASSWORD:Biochar@2026}
app.security.jwt-secret=${JWT_SECRET:replace-this-with-a-random-secret-at-least-32-characters}
app.security.access-ttl-seconds=${JWT_ACCESS_TTL:1800}
app.security.refresh-ttl-seconds=${JWT_REFRESH_TTL:604800}
app.security.login-limit=${LOGIN_LIMIT:10}
app.security.login-window-seconds=${LOGIN_WINDOW_SECONDS:900}
app.audit.api-key-sample-seconds=${ACCESS_LOG_API_KEY_SAMPLE_SECONDS:300}

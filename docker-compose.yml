name: aiot-biochar-java

services:
  db:
    image: postgres:16
    container_name: aiot-biochar-java-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biochar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biochar_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-edge_aiot_biochar}
      SEED_DEMO: ${SEED_DEMO:-true}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - aiot_biochar_java_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aiot-biochar-java-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-edge_aiot_biochar}
      DB_USER: ${POSTGRES_USER:-biochar}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-biochar_dev_pw}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-random-secret-at-least-32-characters}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-1800}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      DEV_DEFAULT_PASSWORD: ${DEV_DEFAULT_PASSWORD:-Biochar@2026}
      SEED_DEV_PASSWORDS: ${SEED_DEV_PASSWORDS:-true}
      APP_MIGRATIONS_ENABLED: ${APP_MIGRATIONS_ENABLED:-true}
      MIGRATIONS_DIR: /migrations
      TV5_JOBS_ENABLED: ${TV5_JOBS_ENABLED:-false}
      TV5_DATASET_ID: ${TV5_DATASET_ID:-}
      TV5_USERNAME: ${TV5_USERNAME:-researcher01}
      TV5_ALERT_MINUTES: ${TV5_ALERT_MINUTES:-15}
      TV5_SQI_MINUTES: ${TV5_SQI_MINUTES:-1440}
      TV5_TELEGRAM_TOKEN: ${TV5_TELEGRAM_TOKEN:-}
      TV5_TELEGRAM_CHAT: ${TV5_TELEGRAM_CHAT:-}
      TV4_QC_ENABLED: ${TV4_QC_ENABLED:-false}
      TV4_QC_INTERVAL_MS: ${TV4_QC_INTERVAL_MS:-900000}
      TV4_QC_LOOKBACK_MINUTES: ${TV4_QC_LOOKBACK_MINUTES:-30}
      TV4_USERNAME: ${TV4_USERNAME:-researcher01}
    volumes:
      - ./database/migrations:/migrations:ro
      - tv5_reports:/app/.tv5-reports
    ports:
      - "${APP_PORT:-8081}:8080"

volumes:
  aiot_biochar_java_pgdata:
  tv5_reports:
